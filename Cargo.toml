[package]
name = "cc-sessions"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "cs"
path = "src/main.rs"

[[bin]]
name = "cs-banc"
path = "src/banc/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
skim = "4"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
memchr = "2"
sha2 = "0.10"
url = "2"
ureq = { version = "2", features = ["json"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }

[profile.release]
strip = true
